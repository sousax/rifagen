<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rifa</title>
<style>
  :root { --livre:#e5e7eb; --res:#fbbf24; --pago:#22c55e; --tx:#111827; --mut:#6b7280; --bg:#f9fafb; }
  * { box-sizing:border-box; }
  body { margin:0 auto; max-width:480px; font:16px/1.35 system-ui, sans-serif; color:var(--tx); background:var(--bg); }
  button { font:inherit; border:0; border-radius:10px; padding:10px 14px; background:#e5e7eb; cursor:pointer; }
  button.pri { background:var(--tx); color:#fff; }
  h1 { font-size:20px; margin:0; }
  .pad { padding:12px 16px; }
  .row { display:flex; gap:8px; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .mut { color:var(--mut); font-size:13px; }
  .grid { display:grid; grid-template-columns:repeat(5, 1fr); gap:6px; }
  .n { aspect-ratio:1; padding:0; font-weight:600; background:var(--livre); }
  .n.reservado { background:var(--res); } .n.pago { background:var(--pago); color:#fff; }
  .n.sel { outline:3px solid #2563eb; background:#dbeafe; }
  .n.dim { opacity:.25; }
  #filtros { gap:4px; } #filtros button { flex:1; padding:6px 0; font-size:14px; white-space:pre-line; } #filtros button[aria-pressed=true] { background:var(--tx); color:#fff; }
  .cards > div { flex:1; background:#fff; border-radius:14px; padding:12px; box-shadow:0 1px 2px #0001; }
  .money { font-size:22px; font-weight:700; }
  input, textarea { font:inherit; width:100%; padding:10px; border:1px solid #d1d5db; border-radius:10px; background:#fff; }
  label { display:block; font-size:13px; color:var(--mut); margin:10px 0 4px; }
  .barra { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; margin:0;
    padding:12px 16px; background:#fff; border-radius:14px 14px 0 0; box-shadow:0 -2px 8px #0002; }
  #tela-grade { padding-bottom:72px; }
  dialog { width:100%; max-width:480px; margin:auto auto 0; border:0; border-radius:18px 18px 0 0; padding:16px; }
  dialog h2 { font-size:16px; margin:0 0 8px; }
  dialog .row button { flex:1; }
  hr { border:0; border-top:1px solid #e5e7eb; margin:16px 0; }
  h2 { font-size:16px; margin:0 0 8px; }
  .err { color:#b91c1c; font-size:14px; margin-top:6px; }
  .chip { display:inline-block; min-width:44px; text-align:center; padding:3px 8px; border-radius:999px; font-size:13px; background:var(--livre); }
  .chip.reservado { background:var(--res); } .chip.pago { background:var(--pago); color:#fff; }
  select { font:inherit; flex:1; padding:8px; border:1px solid #d1d5db; border-radius:10px; background:#fff; }
  a.wa { display:block; text-align:center; text-decoration:none; margin-top:14px; border-radius:10px; padding:10px 14px; background:#25d366; color:#fff; }
  [hidden] { display:none !important; }
  .n.ganhou { outline:3px solid #a16207; }
  #ganhadores { list-style:none; padding:0; margin:0 0 12px; background:#fff; border-radius:14px; box-shadow:0 1px 2px #0001; }
  #ganhadores li { display:flex; gap:8px; align-items:center; justify-content:space-between; padding:10px 12px; border-top:1px solid #f3f4f6; }
  #ganhadores li:first-child { border-top:0; }
  #ganhadores a { color:#15803d; font-weight:600; text-decoration:none; white-space:nowrap; }
  #sortear { width:100%; margin-bottom:10px; }
  .sorteio-n { font-size:72px; font-weight:800; text-align:center; margin:12px 0; font-variant-numeric:tabular-nums; }
  #sorteio-cartao { text-align:center; font-weight:600; }
  fieldset { border:0; padding:0; margin:0; }
</style>
</head>
<body>
<main class="pad">
  <section id="tela-carregando"><p class="mut">Carregando…</p></section>

  <section id="tela-login" hidden>
    <h1>Rifa</h1>
    <form id="entrar">
      <p><input type="email" name="email" placeholder="E-mail" autocomplete="username" required></p>
      <p><input type="password" name="senha" placeholder="Senha" autocomplete="current-password" required></p>
      <p class="mut" id="erro-login" hidden>E-mail ou senha errados.</p>
      <button class="pri">Entrar</button>
    </form>
  </section>

  <section id="tela-sem-acesso" hidden>
    <h1>Sem acesso</h1>
    <p class="mut"><span class="email"></span> não está na lista de organizadores.</p>
    <button class="sair">Sair</button>
  </section>

  <section id="tela-grade" hidden>
    <div class="row">
      <h1 id="titulo">Rifa</h1>
      <div><button id="abrir-config" aria-label="Configurar rifa">⚙️</button> <button class="sair">Sair</button></div>
    </div>
    <section id="bloco-ganhadores" hidden>
      <h2>Ganhadores</h2>
      <ul id="ganhadores"></ul>
    </section>
    <div class="row cards">
      <div><div class="mut">Arrecadado</div><div class="money" id="arrecadado"></div></div>
      <div><div class="mut">A receber</div><div class="money" id="receber"></div></div>
    </div>
    <button class="pri" id="sortear" hidden></button>
    <p class="mut" id="sorteio-aviso" hidden></p>
    <input id="busca" type="search" placeholder="Buscar comprador (nome ou telefone)" autocomplete="off">
    <div class="row" id="filtros" style="margin:10px 0">
      <button data-filtro="todos">Todos</button>
      <button data-filtro="livre">Livres</button>
      <button data-filtro="reservado">Reservados</button>
      <button data-filtro="pago">Pagos</button>
    </div>
    <div class="grid" id="grade"></div>

    <div class="row barra" id="barra" hidden>
      <span id="qtd-sel"></span>
      <button id="limpar">Limpar</button>
      <button class="pri" id="registrar">Registrar</button>
    </div>

    <dialog id="painel-registrar">
      <form method="dialog">
        <h2 id="registrar-titulo"></h2>
        <datalist id="nomes"></datalist>
        <label for="reg-nome">Nome</label>
        <input id="reg-nome" list="nomes" autocomplete="off" required>
        <label for="reg-tel">Telefone</label>
        <input id="reg-tel" type="tel" placeholder="(11) 98765-4321" required>
        <div class="err" id="reg-err"></div>
        <div class="row" style="margin-top:12px">
          <button value="reservado">Reservar</button>
          <button value="pago" class="pri">Já pagou</button>
        </div>
        <button value="" formnovalidate style="width:100%">Cancelar</button>
      </form>
    </dialog>

    <dialog id="painel-comprador">
      <h2 id="comp-nome"></h2>
      <div class="mut" id="comp-tel"></div>
      <div id="comp-numeros"></div>
      <div class="err" id="comp-err"></div>
      <a class="wa" id="comp-wa" target="_blank" rel="noopener">WhatsApp</a>
      <form method="dialog"><button style="width:100%;margin-top:8px">Fechar</button></form>
    </dialog>

    <dialog id="painel-sorteio">
      <h2 id="sorteio-premio"></h2>
      <div class="sorteio-n" id="sorteio-numero" aria-live="off"></div>
      <p id="sorteio-cartao" role="status"></p>
      <form method="dialog"><button class="pri" id="sorteio-fechar" style="width:100%" hidden>Fechar</button></form>
    </dialog>
  </section>

  <section id="tela-config" hidden>
    <div class="row">
      <h1>Configurar rifa</h1>
      <button id="fechar-config">Voltar</button>
    </div>
    <form id="form-config"><fieldset id="cf-campos">
      <p class="mut" id="cf-encerrada" hidden>Rifa encerrada: depois do sorteio nada pode ser alterado.</p>
      <label for="cf-total">Total de números</label><input id="cf-total" type="number" min="1" step="1" required>
      <label for="cf-preco">Preço por número (R$)</label><input id="cf-preco" type="number" min="0.01" step="0.01" required>
      <label for="cf-data">Data do sorteio</label><input id="cf-data" type="date">
      <label for="cf-premios">Prêmios (um por linha, na ordem: 1º, 2º, …)</label><textarea id="cf-premios" rows="4"></textarea>
      <div id="cf-err" class="err" role="alert"></div>
      <div class="row" style="margin-top:10px"><button class="pri" id="cf-salvar">Salvar</button></div>
    </fieldset></form>
    <hr>
    <button id="baixar-backup">Baixar backup</button>
  </section>
</main>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';
import { grade, totais, normalizarTelefone, nomeBackup, validarConfiguracao, esmaecidos, linkWhatsApp, mensagemCobranca,
  premiosPendentes, concorrentes, podeSortear, sortear, mensagemGanhador } from './rifa.js';

// Públicas por design: a proteção é a RLS (schema.sql). Ver README, passo 4.
const SUPABASE_URL = 'https://fdibohxpiysxgxgaqxsv.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_UvCdsSgIVe0csS-KYMHorQ_AR-S7g-F';

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY); // sessão fica no localStorage
const brl = v => Number(v).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

function mostrar(id) {
  for (const s of document.querySelectorAll('main > section')) s.hidden = s.id !== id;
}

const $ = id => document.getElementById(id);
let dados; // { rifa, numeros, compradores, ganhadores } do último carregar
const sel = new Set(); // números livres selecionados para registrar
// Existindo qualquer ganhador, a rifa fica só leitura (a RLS também recusa as escritas).
const encerrada = () => dados.ganhadores.length > 0;
let filtro = 'todos';

async function carregar(session) {
  if (!session) { ouvir(null); return mostrar('tela-login'); }
  // ponytail: numeros sem paginação; o Supabase devolve até 1000 linhas por request, pagine se a rifa passar disso.
  const [rifa, numeros, compradores, ganhadores] = await Promise.all([
    sb.from('rifa').select('total, preco, data_sorteio, premios').maybeSingle(),
    sb.from('numeros').select('numero, estado, comprador_id'),
    sb.from('compradores').select('id, nome, telefone').order('nome'),
    sb.from('ganhadores').select('posicao, numero').order('posicao'),
  ]);
  const erro = rifa.error || numeros.error || compradores.error || ganhadores.error;
  if (erro) return alert(erro.message);
  if (!rifa.data) { // RLS esconde tudo de quem não é organizador
    for (const el of document.querySelectorAll('.email')) el.textContent = session.user.email;
    return mostrar('tela-sem-acesso');
  }
  dados = { rifa: rifa.data, numeros: numeros.data, compradores: compradores.data, ganhadores: ganhadores.data };
  desenhar();
  mostrar('tela-grade');
  ouvir(session);
}

// Ao vivo: qualquer mudança nas 4 tabelas (de outro organizador ou do painel do Supabase) recarrega.
// A RLS vale também aqui: só organizador recebe os eventos (README, passo 6).
let canal, espera;
function ouvir(session) {
  if (!session) { if (canal) sb.removeChannel(canal); canal = null; return; }
  sb.realtime.setAuth(session.access_token); // eventos filtrados pela RLS deste usuário
  if (canal) return;
  canal = sb.channel('rifa');
  for (const table of ['rifa', 'compradores', 'numeros', 'ganhadores'])
    canal.on('postgres_changes', { event: '*', schema: 'public', table }, aoMudar);
  canal.subscribe();
}
function aoMudar() {
  clearTimeout(espera); // várias linhas de uma vez (ex.: registrar 5 números) = um recarregar só
  espera = setTimeout(() => {
    if ($('painel-sorteio').open && $('sorteio-fechar').hidden) return; // girando: o sorteio recarrega no fim
    if (!$('tela-config').hidden) return; // não tira da configuração; Voltar recarrega
    recarregar();
  }, 300);
}

const recarregar = async () => carregar((await sb.auth.getSession()).data.session);

// Comprador dono de um número.
const donoDe = numero => {
  const n = dados.numeros.find(n => n.numero === numero);
  return dados.compradores.find(c => c.id === n?.comprador_id);
};
const nomePremio = posicao => `${posicao}º prêmio · ${dados.rifa.premios[posicao - 1]}`;

function desenharSorteio() {
  const { rifa, numeros, ganhadores } = dados;
  $('bloco-ganhadores').hidden = !ganhadores.length;
  $('ganhadores').replaceChildren(...ganhadores.map(g => {
    const c = donoDe(g.numero);
    const li = document.createElement('li');
    li.append(`${nomePremio(g.posicao)} — Nº ${g.numero} · ${c?.nome ?? '?'}`);
    if (c) {
      const a = document.createElement('a');
      a.href = linkWhatsApp(c.telefone, mensagemGanhador(g.numero, rifa.premios[g.posicao - 1]));
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = 'WhatsApp';
      li.append(a);
    }
    return li;
  }));
  const pendentes = premiosPendentes(rifa.premios, ganhadores);
  const possivel = podeSortear(rifa.premios, numeros, ganhadores);
  const livres = concorrentes(numeros, ganhadores).length; // pagos que ainda não ganharam
  $('sortear').hidden = !possivel;
  if (possivel) $('sortear').textContent = `Sortear ${nomePremio(pendentes[0])}`;
  $('sorteio-aviso').hidden = !pendentes.length || possivel;
  $('sorteio-aviso').textContent = `Sorteio indisponível: ${livres} número${livres === 1 ? '' : 's'} pago${livres === 1 ? '' : 's'} sem prêmio `
    + `para ${pendentes.length} prêmio${pendentes.length === 1 ? '' : 's'}. Cada prêmio precisa de um número pago diferente.`;
}

function desenhar() {
  const { rifa, numeros, compradores } = dados;
  const ocupados = new Set(numeros.map(n => n.numero));
  const premiados = new Set(dados.ganhadores.map(g => g.numero));
  if (encerrada()) sel.clear();
  for (const n of sel) if (ocupados.has(n) || n > rifa.total) sel.delete(n); // ocupado por outro organizador ou fora do total novo
  desenharSorteio();
  const t = totais(numeros, rifa.preco);
  $('titulo').textContent = `Rifa · ${brl(rifa.preco)}`;
  $('arrecadado').textContent = brl(t.arrecadado);
  $('receber').textContent = brl(t.receber);
  const dono = new Map(numeros.map(n => [n.numero, n.comprador_id]));
  const g = grade(rifa.total, numeros);
  const rotulo = { todos: 'Todos', livre: 'Livres', reservado: 'Reservados', pago: 'Pagos' };
  for (const b of $('filtros').children) {
    const f = b.dataset.filtro;
    b.textContent = `${rotulo[f]}\n${f === 'todos' ? g.length : g.filter(n => n.estado === f).length}`;
    b.setAttribute('aria-pressed', f === filtro);
  }
  const dim = esmaecidos(rifa.total, numeros, compradores, $('busca').value, filtro);
  $('grade').replaceChildren(...g.map(({ numero, estado }) => {
    const b = document.createElement('button');
    b.className = `n ${estado}${sel.has(numero) ? ' sel' : ''}${dim.has(numero) ? ' dim' : ''}${premiados.has(numero) ? ' ganhou' : ''}`;
    b.textContent = numero;
    b.setAttribute('aria-label', `${numero} ${estado}${premiados.has(numero) ? ' ganhador' : ''}`);
    if (estado === 'livre') {
      if (encerrada()) return b; // só leitura: livre não seleciona
      b.setAttribute('aria-pressed', sel.has(numero));
      b.onclick = () => { sel.has(numero) ? sel.delete(numero) : sel.add(numero); desenhar(); };
    } else {
      b.onclick = () => { compradorAberto = dono.get(numero); $('comp-err').textContent = ''; desenharComprador(); $('painel-comprador').showModal(); };
    }
    return b;
  }));
  $('barra').hidden = !sel.size;
  $('qtd-sel').textContent = `${sel.size} selecionado${sel.size > 1 ? 's' : ''}`;
  // Redesenha também depois de um conflito ou de mudança ao vivo: o título acompanha a seleção.
  $('registrar-titulo').textContent = sel.size ? `Registrar ${[...sel].sort((a, b) => a - b).join(', ')}` : 'Nenhum número selecionado';
  $('nomes').replaceChildren(...compradores.map(c => new Option('', c.nome)));
  if ($('painel-comprador').open) desenharComprador();
}

// Painel do comprador: todos os números dele, cada um com reservado / pago / liberar.
let compradorAberto; // id do comprador no painel
function desenharComprador() {
  const c = dados.compradores.find(c => c.id === compradorAberto);
  if (!c) return $('painel-comprador').close(); // sumiu (ex.: apagado no painel do Supabase)
  const meus = dados.numeros.filter(n => n.comprador_id === c.id).sort((a, b) => a.numero - b.numero);
  $('comp-nome').textContent = c.nome;
  $('comp-tel').textContent = '+' + c.telefone;
  $('comp-numeros').replaceChildren(...meus.map(n => {
    const linha = document.createElement('div');
    linha.className = 'row';
    linha.style.marginTop = '8px';
    const chip = document.createElement('span');
    chip.className = `chip ${n.estado}`;
    chip.textContent = n.numero;
    const s = document.createElement('select');
    s.setAttribute('aria-label', `Estado do número ${n.numero}`);
    s.append(new Option('reservado', 'reservado'), new Option('pago', 'pago'), new Option('liberar', 'livre'));
    s.value = n.estado;
    s.disabled = encerrada(); // depois do sorteio o painel só mostra
    s.onchange = () => mudarEstado(n.numero, s.value);
    linha.append(chip, s);
    return linha;
  }));
  if (!meus.length) $('comp-numeros').innerHTML = '<p class="mut">Sem números.</p>';
  $('comp-wa').hidden = encerrada(); // só leitura: nada a cobrar
  $('comp-wa').href = linkWhatsApp(c.telefone,
    mensagemCobranca({ nome: c.nome, numeros: meus, preco: dados.rifa.preco, dataSorteio: dados.rifa.data_sorteio }));
}

// Liberar = apagar a linha; o comprador continua cadastrado.
async function mudarEstado(numero, estado) {
  const q = sb.from('numeros');
  const { error } = estado === 'livre' ? await q.delete().eq('numero', numero) : await q.update({ estado }).eq('numero', numero);
  $('comp-err').textContent = error ? error.message : '';
  await recarregar(); // grade, painel e comprador redesenhados
}

$('limpar').onclick = () => { sel.clear(); desenhar(); };
$('busca').oninput = () => desenhar();
for (const b of $('filtros').children) b.onclick = () => { filtro = b.dataset.filtro; desenhar(); };

$('registrar').onclick = () => {
  $('reg-err').textContent = '';
  $('painel-registrar').showModal();
};

// Escolher um comprador sugerido preenche o telefone dele.
$('reg-nome').oninput = e => {
  const c = dados.compradores.find(c => c.nome === e.target.value);
  if (c) $('reg-tel').value = c.telefone;
};

$('painel-registrar').querySelector('form').onsubmit = async e => {
  const estado = e.submitter?.value;
  if (!estado) return; // Cancelar: o form method=dialog fecha
  e.preventDefault();
  const err = msg => { $('reg-err').textContent = msg; };
  const nome = $('reg-nome').value.trim();
  const telefone = normalizarTelefone($('reg-tel').value);
  if (!telefone) return err('Telefone inválido: informe DDD + número.');
  if (!sel.size) return err('Selecione ao menos um número livre.');
  for (const b of e.target.querySelectorAll('button')) b.disabled = true;
  try {
    // Uma transação (função registrar, schema.sql): comprador novo + números, tudo ou nada.
    const nums = [...sel];
    const r = await sb.rpc('registrar', { nome, telefone, numeros: nums, estado });
    if (r.error?.code === '23505') {
      const { data } = await sb.from('numeros').select('numero').in('numero', nums);
      err(`Nada foi salvo. Já ocupado: ${(data ?? []).map(n => n.numero).sort((a, b) => a - b).join(', ')}.`);
      return recarregar(); // grade atrás do painel mostra o ocupado
    }
    if (r.error) return err(r.error.message);
    sel.clear();
    $('painel-registrar').close();
    e.target.reset();
    await recarregar();
  } finally {
    for (const b of e.target.querySelectorAll('button')) b.disabled = false;
  }
};

$('abrir-config').onclick = () => {
  $('cf-total').value = dados.rifa.total;
  $('cf-preco').value = dados.rifa.preco;
  $('cf-data').value = dados.rifa.data_sorteio ?? '';
  $('cf-premios').value = dados.rifa.premios.join('\n');
  $('cf-err').textContent = '';
  $('cf-campos').disabled = $('cf-salvar').hidden = encerrada(); // backup continua disponível
  $('cf-encerrada').hidden = !encerrada();
  mostrar('tela-config');
};
$('fechar-config').onclick = () => recarregar();
$('form-config').onsubmit = async e => {
  e.preventDefault();
  const nova = {
    total: Number($('cf-total').value),
    preco: Number($('cf-preco').value),
    data_sorteio: $('cf-data').value || null,
    premios: $('cf-premios').value.split('\n').map(s => s.trim()).filter(Boolean),
  };
  // Relê os números: outro organizador pode ter registrado um número alto nesse meio tempo.
  const n = await sb.from('numeros').select('numero, estado');
  if (n.error) return $('cf-err').textContent = n.error.message;
  const erro = validarConfiguracao(nova, n.data);
  if (erro) return $('cf-err').textContent = erro;
  const { error } = await sb.from('rifa').update(nova).eq('id', true);
  if (error) return $('cf-err').textContent = error.message;
  recarregar();
};

// Sorteio: um prêmio por toque, do último ao 1º. Grava o ganhador ao revelar.
$('sortear').onclick = async () => {
  $('sortear').disabled = true; // toque duplo não sorteia duas vezes
  try { await sortearProximo(); } finally { $('sortear').disabled = false; }
};
async function sortearProximo() {
  await recarregar(); // dados frescos: outro organizador pode ter sorteado ou marcado pagos
  const { rifa, numeros, ganhadores } = dados;
  if (!podeSortear(rifa.premios, numeros, ganhadores)) return;
  if (!ganhadores.length) {
    const reservados = numeros.filter(n => n.estado === 'reservado').length;
    if (!confirm(`${reservados} número${reservados === 1 ? '' : 's'} reservado${reservados === 1 ? '' : 's'} não vão concorrer. `
      + 'Sortear mesmo assim?\n\nBaixe um backup (⚙️) antes de sortear.')) return;
  }
  const posicao = premiosPendentes(rifa.premios, ganhadores)[0];
  const giro = concorrentes(numeros, ganhadores);
  const numero = sortear(numeros, ganhadores);

  $('sorteio-premio').textContent = nomePremio(posicao);
  $('sorteio-cartao').textContent = '';
  $('sorteio-fechar').hidden = true;
  $('painel-sorteio').showModal();
  // ~3 s girando e desacelerando: cada passo 15% mais lento que o anterior.
  for (let espera = 50, total = 0; total < 3000; total += espera, espera *= 1.15) {
    $('sorteio-numero').textContent = giro[Math.floor(Math.random() * giro.length)]; // só visual
    await new Promise(r => setTimeout(r, espera));
  }
  $('sorteio-numero').textContent = numero;

  const { error } = await sb.from('ganhadores').insert({ posicao, numero });
  if (error?.code === '23505') { // outro organizador sorteou este prêmio agora: vale o dele
    $('sorteio-numero').textContent = '';
    $('sorteio-cartao').textContent = 'Outro organizador sorteou este prêmio agora. O resultado dele foi mantido.';
  } else if (error) {
    $('sorteio-numero').textContent = '';
    $('sorteio-cartao').textContent = `Nada foi gravado: ${error.message}`;
  } else {
    $('sorteio-cartao').textContent = `Nº ${numero} · ${donoDe(numero)?.nome ?? '?'} · ${rifa.premios[posicao - 1]}`;
  }
  $('sorteio-fechar').hidden = false;
  await recarregar();
}
// Durante o giro o painel não fecha (Esc).
$('painel-sorteio').oncancel = e => { if ($('sorteio-fechar').hidden) e.preventDefault(); };

document.getElementById('entrar').onsubmit = async e => {
  e.preventDefault();
  const f = e.target;
  const { error } = await sb.auth.signInWithPassword({ email: f.email.value.trim(), password: f.senha.value });
  $('erro-login').hidden = !error;
  if (!error) f.reset();
};
for (const b of document.querySelectorAll('.sair')) b.onclick = () => sb.auth.signOut();

// Backup: as 4 tabelas inteiras num JSON. <a download> + Blob baixa também no celular.
// ponytail: sem paginação, até 1000 linhas por tabela (limite do Supabase), igual ao carregar().
document.getElementById('baixar-backup').onclick = async () => {
  const tabelas = ['rifa', 'compradores', 'numeros', 'ganhadores'];
  const res = await Promise.all(tabelas.map(t => sb.from(t).select('*')));
  const erro = res.find(r => r.error);
  if (erro) return alert(erro.error.message);
  const backup = Object.fromEntries(tabelas.map((t, i) => [t, res[i].data]));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' }));
  a.download = nomeBackup(new Date());
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

// Dispara INITIAL_SESSION ao abrir, SIGNED_IN ao entrar e SIGNED_OUT ao sair.
// setTimeout: não chamar o supabase de dentro do callback (trava o lock de auth).
sb.auth.onAuthStateChange((evento, session) => {
  if (evento !== 'TOKEN_REFRESHED') setTimeout(() => carregar(session));
});
</script>
